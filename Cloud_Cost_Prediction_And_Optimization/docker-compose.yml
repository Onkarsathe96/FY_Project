services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_cost_prediction_and_optimization}
      POSTGRES_USER: ${POSTGRES_USER:-cloud_cost_prediction_and_optimization}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_cost_prediction_and_optimization}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cloud_cost_prediction_and_optimization:cloud_cost_prediction_and_optimization@db:5432/cloud_cost_prediction_and_optimization
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      # Allows boto3 to read your local named profile; the mount is read-only.
      - ${USERPROFILE}/.aws:/root/.aws:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
